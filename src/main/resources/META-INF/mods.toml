modLoader = "javafml"
loaderVersion = "${loader_version}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
logoFile = "icon.png"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "${mod_authors}"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${loader_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
